name: Publicar Alpha Gestion

# Se dispara con un tag de version. Ejemplos:
#   git tag v0.2.0        -> release final, le llega a todos
#   git tag v0.2.0-beta.1 -> prerelease, solo para las maquinas de prueba
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # crear el release y subir los artefactos con el GITHUB_TOKEN integrado

# Los dos sistemas publican SECUENCIALMENTE a proposito. En v0.2.0 corrieron en
# paralelo y cada electron-builder creo SU PROPIA release para el mismo tag
# (carrera al verificar si existia): los assets quedaron repartidos en dos
# releases y las URLs por tag resolvian solo una. Con Windows primero y macOS
# despues, el segundo encuentra la release ya creada y adjunta ahi.
jobs:
  publicar-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` dispara el postinstall (electron-rebuild): los nativos quedan
      # compilados para la plataforma del runner. Cross-compilar no es opcion.
      - run: npm ci
      - name: Publicar (Windows)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-beta') }}
          # OJO: NO definir CSC_LINK aca. Si el secret no existe llega como
          # string vacio y electron-builder lo trata como ruta de certificado.
          # Sin definir, saltea la firma (SmartScreen pide confirmar una vez).
        run: npm run publicar:win

  publicar-macos:
    runs-on: macos-latest
    needs: publicar-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publicar (macOS)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-beta') }}
          # Sin estos secrets, publica sin firmar y el auto-update de macOS
          # queda inactivo (ver src/main/actualizador.ts).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run publicar:mac
