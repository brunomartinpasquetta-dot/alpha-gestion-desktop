appId: ar.com.alfajores.erp
productName: Alpha Gestion
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

# Solo viaja lo compilado. El codigo fuente TypeScript no entra al paquete.
#
# Los "!" de abajo son un arreglo de un bug real: electron-rebuild deja en
# node_modules copias COMPILADAS PARA ESTA MAC (bcrypt/build, bcrypt/bin) y
# node-gyp-build las prefiere por sobre los prebuilds oficiales. Como el
# instalador de Windows se arma desde esta Mac, esas copias viajaban adentro y
# la app moria al arrancar en Windows con "error de JavaScript" (require de un
# binario Mach-O en Windows). Excluirlas obliga a cada plataforma a cargar SU
# prebuild oficial (bcrypt/prebuilds/win32-x64, better-sqlite3/prebuilds/...),
# que es exactamente lo que hacia la 1.1.0 que funcionaba.
files:
  - dist/**/*
  - package.json
  - "!node_modules/bcrypt/build/**"
  - "!node_modules/bcrypt/bin/**"
  - "!node_modules/better-sqlite3/build/**"

# Las migraciones de Drizzle NO van dentro del asar: `rutas-db.ts` las busca
# primero en process.resourcesPath/drizzle, que es exactamente donde caen aca.
extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - "**/*"
  # La base de conocimiento del asistente: se lee en runtime (gotcha kbLoader
  # de StockFlow: JSON grande jamas inlineado en el bundle del main).
  - from: src/server/asistente/conocimiento
    to: conocimiento
    filter:
      - "*.json"
  # Clave del tunel de pedidos remotos: restringida en el VPS a abrir un solo
  # puerto hacia loopback (no da shell). Sin esto el sistema no puede publicar
  # la pantalla de pedidos en internet.
  - from: recursos/tunel
    to: tunel
    filter:
      - "tunel_alpha"

asar: true
# Los modulos nativos tienen que quedar fuera del asar para poder cargarse.
# No alcanza con "**/*.node": better-sqlite3 y bcrypt resuelven su binario en
# tiempo de ejecucion recorriendo su propia carpeta de prebuilds.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/bcrypt/**"

mac:
  category: public.app-category.business
  icon: build/icon.icns
  # Build local sin firmar: Gatekeeper va a pedir "Abrir de todos modos" la
  # primera vez. Para distribuir de verdad hay que configurar CSC_LINK +
  # CSC_KEY_PASSWORD y activar hardenedRuntime + notarizacion.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip   # requerido por electron-updater en macOS
      arch:
        - arm64

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Alpha Gestion

publish:
  - provider: github
    owner: brunomartinpasquetta-dot
    repo: alpha-gestion-desktop
    # Repo PUBLICO a proposito: asi el updater baja latest.yml y el instalador
    # por URL directa, sin necesidad de que el cliente tenga un token.
    private: false
    # El workflow lo pisa con EP_PRE_RELEASE=true cuando el tag lleva sufijo
    # -beta: una prerelease queda fuera de /releases/latest y no le llega a
    # nadie en el canal estable.
    releaseType: release
